[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "project"
version = "0.0.1"
description = "Project on using NLP to classify if a tweet is about a real disaster or not"
authors = [
  { name = "Ida Puggaard", email = "your@email.com" },
]
license = { file = "LICENSE" }
keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bentoml>=1.4.39",
    "dotenv>=0.9.9",
    "dvc-gs>=3.1.0",
    "evidently>=0.7.23",
    "fastapi==0.115.6",
    "httpx>=0.28.1",
    "hydra-core>=1.3.5",
    "locust>=2.46.6",
    "loguru>=0.7.3",
    "matplotlib>=3.11.1",
    "ml-dtypes>=0.5.0",
    "numpy<2.0.0",
    "onnx==1.19.0",
    "onnxruntime==1.20.1",
    "onnxscript>=0.5.0",
    "pandas>=2.3.3",
    "pytorch-lightning>=2.6.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit==1.41.1",
    "torch==2.2.0",
    "transformers==4.48.0",
    "typer==0.15.1",
    "uvicorn==0.34.0",
    "wandb>=0.29.0",
]

[dependency-groups]
dev = [
    "coverage==7.6.9",
    "invoke==2.2.0",
    "pre-commit==4.1.0",
    "pytest==8.3.4",
    "ruff==0.1.3",
    "mypy==1.19.1",
    "mkdocs-material==9.7.1",
    "mkdocstrings-python==2.0.1",
    "dvc>=3.67.1",
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120

[tool.coverage.run]
omit = ["tests/*"]
